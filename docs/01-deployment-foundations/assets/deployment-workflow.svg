<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="48" y="83" font-size="48" fill="#172b4d">大模型部署适配基础知识体系</text>
<text x="50" y="140" font-size="28" fill="#52657c">一条主线串联工程步骤，五层能力组织知识，七个模块覆盖交付。</text>
